<html>
<body>
    <p>Enter a number and click OK</p>
    <input id="id1" type="number" min="50" max="100" required>
    <button onclick="myFunction()">Click me</button>
    <p>Please write a number more than 50 and less than a 100</p>
    <p id="result"></p>
    <script>
        function myFunction() {
            var inpObj = document.getElementById
            ("id1");
            if (!inpObj.checkValidity()) {
                document.getElementById("result").
                innerHTML = inpObj.
                validationMessage;
            } else {
                document.getElementById("result").
                innerHTML = "You can do this transaction"
            }
        }
    </script>
</body>
</html>
